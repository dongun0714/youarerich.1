<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>초파리 커넥톰 3D 자율 비행 시뮬레이터</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #c9d1d9;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 연구용 모던 UI 헤더 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 12px 16px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-block h1 {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
            letter-spacing: -0.3px;
        }

        .title-block p {
            font-size: 10px;
            color: #8b949e;
            margin-top: 2px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: #21262d;
            border: 1px solid #363b42;
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn:active {
            transform: scale(0.96);
            background: #30363d;
        }

        .btn-active {
            background: #1f6feb;
            border-color: #388bfd;
            color: #ffffff;
        }

        .btn-danger {
            background: #3c1e1e;
            border-color: #7d2828;
            color: #f85149;
        }

        /* 하단 서랍식 패널 (모바일 최적화) */
        .drawer-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #30363d;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 14px 16px;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #8b949e;
            background: #161b22;
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid #30363d;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #238636;
        }

        .status-dot.off {
            background: #8b949e;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .hud-card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 10px;
        }

        .hud-card-title {
            font-size: 10px;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meter-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .meter-label {
            font-size: 10px;
            width: 24px;
            color: #c9d1d9;
        }

        .meter-bar-bg {
            flex: 1;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }

        .meter-bar-fill {
            height: 100%;
            width: 0%;
            background: #58a6ff;
            transition: width 0.1s linear;
        }

        /* 3D 터치 안내 레이어 */
        .touch-hint {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(22, 27, 34, 0.75);
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <header>
        <div class="title-block">
            <h1>FlyCX Simulator v2.4</h1>
            <p>초파리 중앙복합체 커넥톰 엔진</p>
        </div>
        <div class="header-controls">
            <button id="btn-toggle-stim" class="btn btn-active">빛 자극 ON</button>
            <button id="btn-cancel-stim" class="btn btn-danger">자극 취소</button>
        </div>
    </header>

    <div class="touch-hint"> 화면을 터치하여 챔버 내 빛 자극 위치 변경</div>

    <div id="canvas-container"></div>

    <div class="drawer-panel">
        <div class="drawer-header">
            <div class="status-badge">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">광성 추적 신경 회로 활성</span>
            </div>
            <button id="btn-recenter" class="btn">시점 리셋</button>
        </div>

        <div class="hud-grid">
            <div class="hud-card">
                <div class="hud-card-title">시각 감각 입력 (Optic Lobe)</div>
                <div class="meter-container">
                    <span class="meter-label">좌측</span>
                    <div class="meter-bar-bg"><div id="meter-left" class="meter-bar-fill"></div></div>
                </div>
                <div class="meter-container">
                    <span class="meter-label">우측</span>
                    <div class="meter-bar-bg"><div id="meter-right" class="meter-bar-fill"></div></div>
                </div>
            </div>

            <div class="hud-card">
                <div class="hud-card-title">조향 출력 (P-EN / VNC)</div>
                <div class="meter-container">
                    <span class="meter-label">회전</span>
                    <div class="meter-bar-bg"><div id="meter-yaw" class="meter-bar-fill" style="background:#f2994a;"></div></div>
                </div>
                <div class="meter-container">
                    <span class="meter-label">추력</span>
                    <div class="meter-bar-bg"><div id="meter-thrust" class="meter-bar-fill" style="background:#6fcf97;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js 및 OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. 씬 및 모바일 렌더러 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 10;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // --- 2. 조명 및 아크릴 실험 챔버 (제한된 공간) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 30, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 챔버 규격 (가로 30, 세로 20, 깊이 30)
        const chamberSize = { x: 30, y: 20, z: 30 };
        const chamberGeo = new THREE.BoxGeometry(chamberSize.x, chamberSize.y, chamberSize.z);
        const chamberMat = new THREE.MeshPhysicalMaterial({
            color: 0x58a6ff,
            transparent: true,
            opacity: 0.12,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 0.5,
            side: THREE.DoubleSide
        });
        const chamber = new THREE.Mesh(chamberGeo, chamberMat);
        chamber.position.y = chamberSize.y / 2;
        scene.add(chamber);

        // 챔버 테두리 선
        const wireframeGeo = new THREE.EdgesGeometry(chamberGeo);
        const wireframeMat = new THREE.LineBasicMaterial({ color: 0x30363d, linewidth: 1 });
        const chamberWire = new THREE.LineSegments(wireframeGeo, wireframeMat);
        chamberWire.position.y = chamberSize.y / 2;
        scene.add(chamberWire);

        // --- 3. 초파리(Drosophila) 3D 모델 조립 ---
        const flyGroup = new THREE.Group();

        // 가슴 (Thorax)
        const thoraxGeo = new THREE.SphereGeometry(0.8, 16, 16);
        thoraxGeo.scale(1, 0.9, 1.3);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc87d32, roughness: 0.4 });
        const thorax = new THREE.Mesh(thoraxGeo, bodyMat);
        flyGroup.add(thorax);

        // 머리 & 빨간 복안 (Compound Eyes)
        const headGeo = new THREE.SphereGeometry(0.5, 12, 12);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(0, 0.2, 0.9);
        flyGroup.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.3, 12, 12);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xb22222, roughness: 0.2 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.35, 0.3, 1.0);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.35, 0.3, 1.0);
        flyGroup.add(leftEye);
        flyGroup.add(rightEye);

        // 배 (Abdomen)
        const abdomenGeo = new THREE.SphereGeometry(1.0, 16, 16);
        abdomenGeo.scale(0.8, 0.8, 1.6);
        const abdomen = new THREE.Mesh(abdomenGeo, bodyMat);
        abdomen.position.set(0, -0.2, -1.4);
        flyGroup.add(abdomen);

        // 날개 (Wings)
        const wingShape = new THREE.PlaneGeometry(1.2, 2.2);
        const wingMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.5,
            roughness: 0.1,
            side: THREE.DoubleSide
        });

        const leftWingGroup = new THREE.Group();
        leftWingGroup.position.set(-0.6, 0.6, 0);
        const leftWing = new THREE.Mesh(wingShape, wingMat);
        leftWing.geometry.translate(0, 1.1, 0);
        leftWing.rotation.x = Math.PI / 2;
        leftWingGroup.add(leftWing);
        flyGroup.add(leftWingGroup);

        const rightWingGroup = new THREE.Group();
        rightWingGroup.position.set(0.6, 0.6, 0);
        const rightWing = new THREE.Mesh(wingShape, wingMat);
        rightWing.geometry.translate(0, 1.1, 0);
        rightWing.rotation.x = Math.PI / 2;
        rightWingGroup.add(rightWing);
        flyGroup.add(rightWingGroup);

        flyGroup.position.set(0, 10, 0);
        scene.add(flyGroup);

        // --- 4. 빛 자극 오브제 (Target Light) ---
        const stimGroup = new THREE.Group();
        const stimLight = new THREE.PointLight(0xffcb6b, 2, 20);
        const stimMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.6, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffcb6b })
        );
        stimGroup.add(stimLight);
        stimGroup.add(stimMesh);
        stimGroup.position.set(0, 12, -8);
        scene.add(stimGroup);

        // --- 5. 커넥톰 비행 제어 엔진 ---
        let isStimActive = true;
        const flyPhysics = {
            pos: new THREE.Vector3(0, 10, 0),
            vel: new THREE.Vector3(0, 0, 0.1),
            rotation: new THREE.Euler(0, 0, 0),
            yaw: 0,
            pitch: 0,
            roll: 0
        };

        // 중앙 복합체 신경 회로 변수
        let sensorLeft = 0;
        let sensorRight = 0;
        let saccadeTimer = 0;
        let saccadeYaw = 0;

        function updateConnectomeEngine(delta) {
            // A. 감각 신경 (Optic Lobe) 연산
            if (isStimActive) {
                const toStim = new THREE.Vector3().subVectors(stimGroup.position, flyGroup.position);
                const dist = toStim.length();
                toStim.normalize();

                // 초파리의 정면 벡터
                const forward = new THREE.Vector3(0, 0, 1).applyEuler(flyGroup.rotation);
                const right = new THREE.Vector3(1, 0, 0).applyEuler(flyGroup.rotation);

                const dotForward = forward.dot(toStim);
                const dotRight = right.dot(toStim);

                sensorLeft = Math.max(0, dotForward - dotRight * 0.8) * (15 / Math.max(dist, 5));
                sensorRight = Math.max(0, dotForward + dotRight * 0.8) * (15 / Math.max(dist, 5));
            } else {
                sensorLeft = 0;
                sensorRight = 0;
            }

            // B. 중앙 복합체(CX) 조향 연산 및 급회전(Saccade) 메커니즘
            let targetYawTorque = (sensorRight - sensorLeft) * 2.5;

            // 자발적 급회전 (Spontaneous Saccades)
            saccadeTimer -= delta;
            if (saccadeTimer <= 0) {
                saccadeTimer = 1.0 + Math.random() * 2.0;
                saccadeYaw = (Math.random() - 0.5) * 3.5;
            }
            targetYawTorque += saccadeYaw;

            // C. 경계 회피 신경 회로 (Boundary Avoidance) - 챔버 벽 충돌 방지
            const margin = 3.5;
            const px = flyPhysics.pos.x;
            const py = flyPhysics.pos.y;
            const pz = flyPhysics.pos.z;

            if (Math.abs(px) > chamberSize.x / 2 - margin) {
                targetYawTorque += (px > 0 ? -4.0 : 4.0);
            }
            if (pz > chamberSize.z / 2 - margin || pz < -chamberSize.z / 2 + margin) {
                targetYawTorque += (pz > 0 ? -4.0 : 4.0);
            }
            if (py < margin) flyPhysics.vel.y += 0.1;
            if (py > chamberSize.y - margin) flyPhysics.vel.y -= 0.1;

            // D. 운동 신경(VNC) 통합 및 이동 처리
            flyPhysics.yaw += targetYawTorque * delta;
            flyGroup.rotation.y = flyPhysics.yaw;

            const speed = isStimActive ? 5.0 + (sensorLeft + sensorRight) * 0.5 : 4.0;
            const moveDir = new THREE.Vector3(0, 0, 1).applyEuler(flyGroup.rotation);
            flyPhysics.vel.lerp(moveDir.multiplyScalar(speed), 0.1);

            flyPhysics.pos.addScaledVector(flyPhysics.vel, delta);

            // 위치 경계 강제 고정
            flyPhysics.pos.x = THREE.MathUtils.clamp(flyPhysics.pos.x, -chamberSize.x / 2 + 0.5, chamberSize.x / 2 - 0.5);
            flyPhysics.pos.y = THREE.MathUtils.clamp(flyPhysics.pos.y, 0.8, chamberSize.y - 0.8);
            flyPhysics.pos.z = THREE.MathUtils.clamp(flyPhysics.pos.z, -chamberSize.z / 2 + 0.5, chamberSize.z / 2 - 0.5);

            flyGroup.position.copy(flyPhysics.pos);

            // 날개 파닥거림
            const flap = Math.sin(Date.now() * 0.06) * 0.6;
            leftWingGroup.rotation.z = flap;
            rightWingGroup.rotation.z = -flap;

            // HUD 업데이트
            document.getElementById('meter-left').style.width = Math.min(100, sensorLeft * 50) + '%';
            document.getElementById('meter-right').style.width = Math.min(100, sensorRight * 50) + '%';
            document.getElementById('meter-yaw').style.width = Math.min(100, Math.abs(targetYawTorque) * 20) + '%';
            document.getElementById('meter-thrust').style.width = Math.min(100, speed * 15) + '%';
        }

        // --- 6. 터치 인터랙션 (빛 자극 이동) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            // UI 영역 클릭 시 감지 방지
            if (e.clientY < 60 || e.clientY > window.innerHeight - 120) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -10);
            const targetPt = new THREE.Vector3();

            if (raycaster.ray.intersectPlane(plane, targetPt)) {
                stimGroup.position.copy(targetPt);
                stimGroup.position.x = THREE.MathUtils.clamp(stimGroup.position.x, -12, 12);
                stimGroup.position.z = THREE.MathUtils.clamp(stimGroup.position.z, -12, 12);
                
                if(!isStimActive) toggleStim(true);
            }
        });

        // --- 7. 자극 ON/OFF 및 취소 버튼 이벤트 ---
        const btnToggle = document.getElementById('btn-toggle-stim');
        const btnCancel = document.getElementById('btn-cancel-stim');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function toggleStim(active) {
            isStimActive = active !== undefined ? active : !isStimActive;
            stimGroup.visible = isStimActive;

            if (isStimActive) {
                btnToggle.classList.add('btn-active');
                btnToggle.innerText = '빛 자극 ON';
                statusDot.classList.remove('off');
                statusText.innerText = '광성 추적 신경 회로 활성';
            } else {
                btnToggle.classList.remove('btn-active');
                btnToggle.innerText = '빛 자극 OFF';
                statusDot.classList.add('off');
                statusText.innerText = '무자극 자율 탐색 비행';
            }
        }

        btnToggle.addEventListener('click', () => toggleStim());
        btnCancel.addEventListener('click', () => toggleStim(false));

        document.getElementById('btn-recenter').addEventListener('click', () => {
            camera.position.set(0, 15, 35);
            controls.target.set(0, 8, 0);
        });

        // --- 8. 애니메이션 루프 및 리사이즈 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            updateConnectomeEngine(delta);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
